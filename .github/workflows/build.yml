name: Build CA ExamForge

on:
  push:
    branches: [ main, master ]

jobs:
  build-all:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Backup custom code/configs before scaffolding
      - name: Backup custom files
        run: |
          mkdir temp_backup
          cp lib/main.dart temp_backup/ 2>$null || true
          cp pubspec.yaml temp_backup/ 2>$null || true

      - name: Create Flutter project structure
        run: |
          flutter create . --org com.caexamforge --project-name ca_exam_forge --platforms=android,windows --force

      # Restore custom code back into project
      - name: Restore custom code
        run: |
          cp temp_backup/main.dart lib/main.dart 2>$null || true
          cp temp_backup/pubspec.yaml pubspec.yaml 2>$null || true

      - run: flutter pub get
      - run: flutter build apk --release
      - run: flutter build windows --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: build/windows/runner/Release/
